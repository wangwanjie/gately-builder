# 定制构建：按 build.gately.cn 提交的选项构建一个目标的 Gately 安装包，上传到本仓库与版本同名的 Release。
# 由构建器 API 经 workflow_dispatch 触发，每次只构建一个目标，产物名为 gately_<版本>_<组合键>_<目标>.<扩展名>。
# docker 目标用 Gately 仓库的 Dockerfile 构建三架构镜像，推送到 ghcr.io/wangwanjie/gately-custom:<版本>-<组合键>，
# 再把记录镜像地址的 gately_<版本>_<组合键>_docker.txt 上传到 Release，作为“已构建”的标记。
name: Build

run-name: gately ${{ inputs.version }} ${{ inputs.profile }} ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Gately 版本 tag，例如 v0.7.0
        required: true
      modules:
        description: 要包含的可选模块，逗号分隔
        required: false
        default: ""
      lang:
        description: 语言档位 zh / cjk-en / all
        required: true
      target:
        description: 构建目标，见 modules.json 的 targets
        required: true
      profile:
        description: 组合键，必须与 custombuild 的计算结果一致
        required: true

permissions:
  contents: write
  packages: write

# 同一组选项同时只构建一次
concurrency:
  group: build-${{ inputs.version }}-${{ inputs.profile }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 输入只经环境变量传给脚本，不直接拼进命令，避免注入
      VERSION: ${{ inputs.version }}
      MODULES: ${{ inputs.modules }}
      LANG_TIER: ${{ inputs.lang }}
      TARGET: ${{ inputs.target }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: 校验输入格式
        run: |
          [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "版本格式不对: $VERSION"; exit 1; }
          [[ "$MODULES" =~ ^[a-z0-9,]*$ ]] || { echo "模块格式不对"; exit 1; }
          [[ "$LANG_TIER" =~ ^[a-z-]+$ ]] || { echo "语言档位格式不对"; exit 1; }
          [[ "$TARGET" =~ ^[a-z0-9-]+$ ]] || { echo "目标格式不对"; exit 1; }
          [[ "$PROFILE" =~ ^[0-9a-f]{12}$ ]] || { echo "组合键格式不对"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: wangwanjie/gately
          ref: ${{ inputs.version }}
          path: src
      - name: 确认该版本支持定制构建
        run: test -f src/modules.json || { echo "$VERSION 没有 modules.json，不支持定制构建"; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: 解析选项并核对组合键
        id: resolve
        working-directory: src
        run: |
          go run ./tools/custombuild resolve -modules "$MODULES" -lang "$LANG_TIER" -targets "$TARGET" > ../resolved.json
          cat ../resolved.json
          got=$(jq -r .profile ../resolved.json)
          [ "$got" = "$PROFILE" ] || { echo "组合键不一致：输入 $PROFILE，计算得到 $got"; exit 1; }
          echo "kind=$(jq -r '.targets[0].kind' ../resolved.json)" >> "$GITHUB_OUTPUT"
          echo "goarch=$(jq -r '.targets[0].goarch // ""' ../resolved.json)" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -r '.targets[0].platforms // ""' ../resolved.json)" >> "$GITHUB_OUTPUT"
      - name: 安装 fnpack（飞牛安装包）
        if: steps.resolve.outputs.kind == 'fpk'
        run: |
          # 固定版本并校验哈希，避免下载被替换（与 Gately 发布流程一致）
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          sudo install -m 0755 fnpack /usr/local/bin/fnpack
      - name: 构建
        if: steps.resolve.outputs.kind != 'docker'
        working-directory: src
        run: go run ./tools/custombuild build -version "$VERSION" -modules "$MODULES" -lang "$LANG_TIER" -targets "$TARGET" -out ../dist
      - name: 打包 OpenWrt 安装包（.ipk / .apk）
        if: steps.resolve.outputs.kind == 'openwrt'
        env:
          GOARCH_NAME: ${{ steps.resolve.outputs.goarch }}
        run: |
          # 在固定摘要的 Alpine 容器中以 root 打包，使用其自带的 apk-tools v3（与 Gately 发布流程一致）
          docker run --rm -v "$PWD/src:/w" -v "$PWD/dist/bin/$TARGET:/bin-in:ro" -v "$PWD/dist:/out" -w /w \
            alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            sh -ec 'deploy/openwrt/build.sh "$1" "$2" /bin-in/gately /out' sh "$VERSION" "$GOARCH_NAME"
          sudo chown -R "$(id -u):$(id -g)" dist
          for ext in ipk apk; do
            mv "dist/gately_${VERSION}_openwrt_${GOARCH_NAME}.$ext" "dist/gately_${VERSION}_${PROFILE}_${TARGET}.$ext"
          done
      - uses: docker/setup-qemu-action@v3
        if: steps.resolve.outputs.kind == 'docker'
      - uses: docker/setup-buildx-action@v3
        if: steps.resolve.outputs.kind == 'docker'
      - uses: docker/login-action@v3
        if: steps.resolve.outputs.kind == 'docker'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 构建并推送定制镜像
        if: steps.resolve.outputs.kind == 'docker'
        env:
          PLATFORMS: ${{ steps.resolve.outputs.platforms }}
        run: |
          image="ghcr.io/wangwanjie/gately-custom:${VERSION}-${PROFILE}"
          args=()
          while IFS= read -r a; do args+=(--build-arg "$a"); done < <(jq -r '.dockerArgs[]' resolved.json)
          docker buildx build src --platform "$PLATFORMS" "${args[@]}" \
            --build-arg VERSION="$VERSION" --build-arg COMMIT="$(git -C src rev-parse HEAD)" \
            --label org.opencontainers.image.source=https://github.com/wangwanjie/gately-builder \
            --label org.opencontainers.image.description="Gately $VERSION custom build $PROFILE" \
            --metadata-file meta.json -t "$image" --push
          mkdir -p dist
          printf '%s\n%s\n' "$image" "$(jq -r '."containerimage.digest"' meta.json)" > "dist/gately_${VERSION}_${PROFILE}_docker.txt"
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/gately_"${VERSION}"_"${PROFILE}"_"${TARGET}".*)
          ls -l "${files[@]}"
          # 每个 Gately 版本对应一个 Release，首次构建时创建
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target main --title "Gately $VERSION 定制构建 / custom builds" \
              --notes "由 https://build.gately.cn 按需生成的 Gately $VERSION 定制安装包。文件名中的 12 位十六进制为功能模块与语言的组合键。 / Custom Gately $VERSION packages built on demand by https://build.gately.cn." \
              || gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release upload "$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
